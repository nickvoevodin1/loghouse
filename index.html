    /* ---------------- NOTIFICATIONS ---------------- */
    let notifyTimers = [];
    function requestNotifyPermission() {
      if (!("Notification" in window)) return Promise.resolve(false);
      if (Notification.permission === "granted") return Promise.resolve(true);
      if (Notification.permission === "denied") return Promise.resolve(false);
      return Notification.requestPermission().then(p => p === "granted");
    }
    function scheduleNotifications() {
      notifyTimers.forEach(t => clearTimeout(t));
      notifyTimers = [];
      if (!state.notify) return;
      const now = Date.now();
      const horizon = isoDate(addDays(new Date(), 2));
      getOccurrences(isoDate(new Date()), horizon).forEach(ev => {
        if (ev._holiday || !ev.reminders || !ev.reminders.length) return;
        const [h, m] = (ev.allDay ? "09:00" : ev.start).split(":").map(Number);
        const evStart = parseDate(ev.date); evStart.setHours(h, m, 0, 0);
        ev.reminders.forEach(offset => {
          const fireAt = evStart.getTime() - offset * 60000;
          const delay = fireAt - now;
          if (delay > 0 && delay < 1000 * 60 * 60 * 36) {
            notifyTimers.push(setTimeout(() => fireNotification(ev, offset), delay));
          }
        });
      });
    }
    function fireNotification(ev, offset) {
      const when = offset === 0 ? "сейчас" : `через ${offset < 60 ? offset + " мин" : (offset / 60) + " ч"}`;
      const body = `${ev.allDay ? "Весь день" : formatTime(ev.start)} · ${when}`;
      try {
        if (state.notify && "Notification" in window && Notification.permission === "granted") {
          new Notification(ev.title, { body });
          return;
        }
      } catch {}
      showToast(`🔔 ${ev.title} — ${when}`);
    }

    /* ---------------- VOICE INPUT ---------------- */
    function startVoiceInput() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { showToast("Голосовой ввод не поддерживается в этом браузере"); return; }
      const recognition = new SR();
      recognition.lang = "ru-RU";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;
      els.voiceBtn.classList.add("listening");
      showToast("Говорите...");
      recognition.onresult = (e) => {
        const text = e.results[0][0].transcript;
        els.quickAdd.value = text;
        const parsed = parseNaturalLanguage(text);
        els.quickAdd.value = "";
        if (isMobile()) closeDrawer();
        openModal(parsed);
      };
      recognition.onerror = () => showToast("Не удалось распознать голос");
      recognition.onend = () => els.voiceBtn.classList.remove("listening");
      recognition.start();
    }

    /* ---------------- NATURAL LANGUAGE QUICK ADD ---------------- */
    /* NB: JS \b word boundaries don't work with Cyrillic, so we use
       whitespace boundaries + explicit [а-яё] classes for declensions. */
    function parseNaturalLanguage(text) {
      let rest = " " + text + " ";
      const today = new Date();
      let date = new Date(today.getFullYear(), today.getMonth(), today.getDate());

      // relative days
      if (/\sпослезавтра\s/i.test(rest)) { date = addDays(date, 2); rest = rest.replace(/\sпослезавтра\s/i, " "); }
      else if (/\sзавтра\s/i.test(rest)) { date = addDays(date, 1); rest = rest.replace(/\sзавтра\s/i, " "); }
      else if (/\sсегодня\s/i.test(rest)) { rest = rest.replace(/\sсегодня\s/i, " "); }

      // weekday ("в понедельник", "во вторник", "в среду" ...) -> next matching weekday
      const weekdays = [
        { re: /\s(?:во?\s+)?воскресень[а-яё]*\s/i, dow: 0 },
        { re: /\s(?:во?\s+)?понедельник[а-яё]*\s/i, dow: 1 },
        { re: /\s(?:во?\s+)?вторник[а-яё]*\s/i, dow: 2 },
        { re: /\s(?:во?\s+)?сред[ауы][а-яё]*\s/i, dow: 3 },
        { re: /\s(?:во?\s+)?четверг[а-яё]*\s/i, dow: 4 },
        { re: /\s(?:во?\s+)?пятниц[ауы][а-яё]*\s/i, dow: 5 },
        { re: /\s(?:во?\s+)?суббот[ауы][а-яё]*\s/i, dow: 6 }
      ];
      for (const wd of weekdays) {
        if (wd.re.test(rest)) {
          let d = new Date(date);
          for (let i = 0; i < 8; i++) { if (d.getDay() === wd.dow && d > date) break; d = addDays(d, 1); }
          date = d;
          rest = rest.replace(wd.re, " ");
          break;
        }
      }

      // time "в 15:30" / "15:30" (with minutes)
      let start = null;
      let tm = rest.match(/\s(?:в\s*)?(\d{1,2})[:.](\d{2})(?=\s)/i);
      if (tm) {
        start = `${pad(Math.min(23, +tm[1]))}:${pad(Math.min(59, +tm[2]))}`;
        rest = rest.replace(tm[0], " ");
      } else {
        // hour-only time requires the "в" preposition ("в 15") to avoid eating durations
        tm = rest.match(/\sв\s*(\d{1,2})(?:\s*(?:час[а-яё]*|ч))?(?=\s)/i);
        if (tm) { start = `${pad(Math.min(23, +tm[1]))}:00`; rest = rest.replace(tm[0], " "); }
      }

      // duration "на час", "на полчаса", "на 2 часа", "на 30 минут", "на 90 мин"
      let durMin = 60;
      let dm = rest.match(/\sна\s*(\d+)\s*(?:минут[а-яё]*|мин)(?=\s)/i);
      if (dm) { durMin = +dm[1]; rest = rest.replace(dm[0], " "); }
      else if ((dm = rest.match(/\sна\s*(\d+)\s*(?:час[а-яё]*|ч)(?=\s)/i))) { durMin = +dm[1] * 60; rest = rest.replace(dm[0], " "); }
      else if (/\sна\s+полчаса(?=\s)/i.test(rest)) { durMin = 30; rest = rest.replace(/\sна\s+полчаса(?=\s)/i, " "); }
      else if (/\sна\s+час(?=\s)/i.test(rest)) { durMin = 60; rest = rest.replace(/\sна\s+час(?=\s)/i, " "); }

      const title = rest.replace(/\s+/g, " ").trim() || "Новое событие";
      if (!start) start = nextRoundedTime();
      const end = addMinutesToTime(start, durMin);
      return { title: title.charAt(0).toUpperCase() + title.slice(1), date: isoDate(date), start, end, calendarId: "startup" };
    }

    /* keyboard shortcuts (Google-Calendar style) */
    function bindKeyboardShortcuts() {
      document.addEventListener("keydown", (e) => {
        const tag = (e.target.tagName || "").toLowerCase();
        const typing = tag === "input" || tag === "textarea" || tag === "select" || e.target.isContentEditable;

        // Escape and undo work everywhere
        if (e.key === "Escape") {
          closeModal(); closeDrawer(); closeToolModal();
          els.choiceBackdrop.classList.remove("open");
          return;
        }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
          if (typing) return;
          e.preventDefault(); undo(); return;
        }
        if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
        // don't fire while a modal is open
        if (els.modalBackdrop.classList.contains("open") || els.toolModalBackdrop.classList.contains("open")) return;

        const setView = (v) => { state.view = v; saveView(); syncViewButtons(); renderAll(); };
        switch (e.key.toLowerCase()) {
          case "c": e.preventDefault(); openModal({ date: isoDate(state.selectedDate) }); break;
          case "t": goToday(); break;
          case "d": case "1": setView("day"); break;
          case "x": case "2": setView("3day"); break;
          case "w": case "3": setView("week"); break;
          case "m": case "4": setView("month"); break;
          case "a": case "5": setView("agenda"); break;
          case "arrowright": case "n": case "j": navigate(1); break;
          case "arrowleft": case "p": case "k": navigate(-1); break;
          case "f": e.preventDefault(); openFindTime(); break;
          case "/": e.preventDefault(); (isMobile() ? els.searchInputMobile : els.searchInput).focus(); break;
        }
      });
    }

    /* swipe to navigate prev/next on the calendar area */
    function bindSwipe() {
      let x0 = null, y0 = null, t0 = 0;
      els.calendarShell.addEventListener("touchstart", (e) => {
        if (e.target.closest(".event, .month-event, .agenda-item")) { x0 = null; return; }
        const t = e.changedTouches[0];
        x0 = t.clientX; y0 = t.clientY; t0 = Date.now();
      }, { passive: true });

      els.calendarShell.addEventListener("touchend", (e) => {
        if (x0 === null) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - x0, dy = t.clientY - y0, dt = Date.now() - t0;
        x0 = null;
        if (dt > 700) return;
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.8) {
          const velocity = Math.abs(dx) / Math.max(1, dt); // px/ms
          const steps = velocity > 1.2 ? 2 : 1; // fast flick = skip 2 periods
          navigate((dx < 0 ? 1 : -1) * steps);
        }
      }, { passive: true });
    }

    function goToday() {
      state.selectedDate = new Date();
      state.miniDate = new Date();
      renderAll();
    }

    function syncViewButtons() {
      [...els.viewSwitch.children, ...els.viewSwitchMobile.children].forEach(b => {
        b.classList.toggle("active", b.dataset.view === state.view);
      });
    }

    function navigate(step) {
      if (state.view === "day") state.selectedDate = addDays(state.selectedDate, step);
      else if (state.view === "3day") state.selectedDate = addDays(state.selectedDate, step * 3);
      else if (state.view === "week") state.selectedDate = addDays(state.selectedDate, step * 7);
      else if (state.view === "agenda") state.selectedDate = addDays(state.selectedDate, step * 7);
      else state.selectedDate = new Date(state.selectedDate.getFullYear(), state.selectedDate.getMonth() + step, 1);
      state.miniDate = new Date(state.selectedDate);
      state._navDir = step > 0 ? "right" : "left";
      renderAll();
    }

    function renderAll() {
      renderTitle();
      renderMiniMonth();
      renderCalendar();
      renderUpcoming();
      if (state._navDir) {
        const cls = state._navDir === "right" ? "slide-from-right" : "slide-from-left";
        els.calendarShell.classList.remove("slide-from-right", "slide-from-left");
        void els.calendarShell.offsetWidth; // reflow
        els.calendarShell.classList.add(cls);
        state._navDir = null;
      }
    }

    function renderTitle() {
      if (state.view === "day") {
        els.rangeTitle.textContent = `${state.selectedDate.getDate()} ${MONTHS_TITLE[state.selectedDate.getMonth()]} ${state.selectedDate.getFullYear()}`;
      } else if (state.view === "3day") {
        const end = addDays(state.selectedDate, 2);
        const sameMonth = state.selectedDate.getMonth() === end.getMonth();
        const left = sameMonth ? state.selectedDate.getDate() : `${state.selectedDate.getDate()} ${MONTHS_TITLE[state.selectedDate.getMonth()]}`;
        els.rangeTitle.textContent = `${left} — ${end.getDate()} ${MONTHS_TITLE[end.getMonth()]} ${end.getFullYear()}`;
      } else if (state.view === "week") {
        const start = startOfWeek(state.selectedDate);
        const end = addDays(start, 6);
        const sameMonth = start.getMonth() === end.getMonth();
        const left = sameMonth ? start.getDate() : `${start.getDate()} ${MONTHS_TITLE[start.getMonth()]}`;
        els.rangeTitle.textContent = `${left} — ${end.getDate()} ${MONTHS_TITLE[end.getMonth()]} ${end.getFullYear()}`;
      } else if (state.view === "agenda") {
        els.rangeTitle.textContent = "Предстоящие события";
      } else {
        els.rangeTitle.textContent = `${capitalize(MONTHS[state.selectedDate.getMonth()])} ${state.selectedDate.getFullYear()}`;
      }
    }

    function renderMiniMonth() {
      const year = state.miniDate.getFullYear();
      const month = state.miniDate.getMonth();
      els.miniTitle.textContent = `${capitalize(MONTHS[month])} ${year}`;

      const first = new Date(year, month, 1);
      const gridStart = startOfWeek(first);
      const days = Array.from({ length: 42 }, (_, i) => addDays(gridStart, i));
      const eventDates = new Set(state.events.map(e => e.date));

      const showWN = state.weekNumbers;
      if (showWN) {
        els.miniGrid.classList.add("show-week-nums");
      } else {
        els.miniGrid.classList.remove("show-week-nums");
      }

      const rows = [];
      for (let r = 0; r < 6; r++) {
        const rowDays = days.slice(r * 7, r * 7 + 7);
        if (showWN) rows.push(`<div class="mini-wnum">${getWeekNumber(rowDays[0])}</div>`);
        rowDays.forEach(day => {
          const classes = [
            "mini-day",
            day.getMonth() !== month ? "outside" : "",
            sameDay(day, new Date()) ? "today" : "",
            sameDay(day, state.selectedDate) ? "selected" : "",
            eventDates.has(isoDate(day)) ? "has-events" : ""
          ].filter(Boolean).join(" ");
          rows.push(`<button class="${classes}" data-date="${isoDate(day)}">${day.getDate()}</button>`);
        });
      }

      els.miniGrid.innerHTML = [
        ...(showWN ? ['<div class="mini-wnum"></div>'] : []),
        ...orderedDow().map(d => `<div class="dow">${d}</div>`),
        ...rows
      ].join("");

      els.miniGrid.querySelectorAll(".mini-day").forEach(btn => {
        btn.addEventListener("click", () => {
          state.selectedDate = parseDate(btn.dataset.date);
          state.miniDate = new Date(state.selectedDate);
          if (state.view === "month" || state.view === "agenda") state.view = "day";
          saveView();
          syncViewButtons();
          if (isMobile()) closeDrawer();
          renderAll();
        });
      });
    }

    function renderCalendar() {
      if (state.view === "month") renderMonthView();
      else if (state.view === "agenda") renderAgenda();
      else renderTimeGrid(state.view);
    }

    function getWeekNumber(date) {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }

    function renderTimeGrid(view) {
      const isWeek = view === "week";
      const isFourDay = view === "3day";
      let days;
      if (isWeek) {
        days = Array.from({ length: 7 }, (_, i) => addDays(startOfWeek(state.selectedDate), i));
        if (state.hideWeekends) days = days.filter(d => d.getDay() !== 0 && d.getDay() !== 6);
      } else if (isFourDay) {
        days = Array.from({ length: 3 }, (_, i) => addDays(state.selectedDate, i));
      } else {
        days = [state.selectedDate];
      }

      const headerClass = isFourDay ? "fourday-header" : isWeek ? "week-header" : "day-header";
      const gridClass = isFourDay ? "fourday-grid" : isWeek ? "week-grid" : "day-grid";
      const occ = getOccurrences(isoDate(addDays(days[0], -1)), isoDate(days[days.length - 1]));

      const gutter = isMobile() ? 42 : 54;
      const colMin = isMobile() ? 0 : 80;
      const dynCols = (isWeek && state.hideWeekends) || isFourDay
        ? ` style="grid-template-columns:${gutter}px repeat(${days.length},minmax(${colMin}px,1fr))"`
        : "";

      const dowRow = `
        <div class="hrow dow-row"${dynCols}>
          <div class="corner">GMT+${timezoneOffsetHours()}</div>
          ${days.map(day => `
            <div class="day-title ${sameDay(day, new Date()) ? "today" : ""}" data-date="${isoDate(day)}">
              <div class="dow">${DOW[(day.getDay() + 6) % 7]}</div>
              <div class="date">${day.getDate()}</div>
            </div>
          `).join("")}
        </div>
      `;

      const alldayRow = `
        <div class="hrow allday-row"${dynCols}>
          <div class="allday-label">весь<br>день</div>
          ${days.map(day => {
            const iso = isoDate(day);
            const dayAllDay = occ.filter(ev => ev.allDay && spansDay(ev, iso));
            return `<div class="allday-cell">${dayAllDay.map(ev => {
              const cal = getCalendar(ev.calendarId);
              const color = ev.color || cal.color;
              const multi = (ev._spanDays || 0) > 0;
              const contd = multi && ev.date !== iso ? " ↩" : "";
              const cls = "allday-chip" + (ev._holiday ? " holiday" : "") + (multi ? " multi" : "");
              return `<button class="${cls}" data-event-id="${ev.id}" data-date="${ev.date}" style="background:${color}">${escapeHtml(ev.title)}${contd}</button>`;
            }).join("")}</div>`;
          }).join("")}
        </div>
      `;

      const header = `<div class="cal-header ${headerClass}">${dowRow}${alldayRow}</div>`;

      const timeLabels = `
        <div class="time-col">
          ${Array.from({ length: HOURS }, (_, i) => `<div class="time-label">${formatHourLabel(START_HOUR + i)}</div>`).join("")}
        </div>
      `;

      // working-hours shading: dim the hours outside [workStart, workEnd)
      const workShade = state.workHours ? (() => {
        const parts = [];
        if (state.workStart > START_HOUR) {
          parts.push(`<div class="offhours" style="top:0;height:${(state.workStart - START_HOUR) * HOUR_HEIGHT}px"></div>`);
        }
        if (state.workEnd < END_HOUR) {
          parts.push(`<div class="offhours" style="top:${(state.workEnd - START_HOUR) * HOUR_HEIGHT}px;height:${(END_HOUR - state.workEnd) * HOUR_HEIGHT}px"></div>`);
        }
        return parts.join("");
      })() : "";

      const columns = days.map(day => {
        const iso = isoDate(day);
        const dayEvents = occ.filter(ev => !ev.allDay).map(ev => daySegment(ev, iso)).filter(Boolean);
        const dayClass = [
          "day-col",
          isWeekendDay(day) ? "weekend" : "",
          sameDay(day, new Date()) ? "today-bg" : ""
        ].filter(Boolean).join(" ");

        return `
          <div class="${dayClass}" data-date="${iso}">
            ${workShade}
            ${Array.from({ length: HOURS }, (_, i) => `
              <div class="hour-cell" data-date="${iso}" data-hour="${START_HOUR + i}"></div>
            `).join("")}
            ${layoutDayEvents(dayEvents)}
          </div>
        `;
      }).join("");

      const viewClass = isFourDay ? "fourday-view" : isWeek ? "week-view" : "day-view";
      const colCount = days.length;
      const dynStyle = (isWeek && state.hideWeekends) || isFourDay
        ? ` style="grid-template-columns:${gutter}px repeat(${colCount},minmax(${colMin}px,1fr))"`
        : "";
      els.calendarShell.innerHTML = `
        <div class="${viewClass}" id="scrollArea">
          ${header}
          <div class="grid ${gridClass}"${dynStyle}>
            ${timeLabels}
            ${columns}
          </div>
        </div>
      `;

      const scrollArea = document.getElementById("scrollArea");
      scrollArea.scrollTop = Math.max(0, (new Date().getHours() - START_HOUR - 1) * HOUR_HEIGHT);

      addNowLine(days);
      bindGridInteractions();
      bindEventInteractions();
      bindDayTitles();
    }

    /* a timed event whose end is at or before its start runs past midnight */
    function isOvernight(ev) {
      return !ev.allDay && timeToMinutes(ev.end) <= timeToMinutes(ev.start);
    }
    function eventDurationMin(ev) {
      const s = timeToMinutes(ev.start), e = timeToMinutes(ev.end);
      return e > s ? e - s : (24 * 60 - s) + e;
    }
    /* the slice of `ev` that falls on `iso`, or null.
       Overnight events yield a head on their own day and a tail on the next. */
    function daySegment(ev, iso) {
      if (ev.date === iso) {
        return isOvernight(ev)
          ? { ...ev, _segStart: ev.start, _segEndMin: 24 * 60 }
          : { ...ev, _segStart: ev.start, _segEndMin: timeToMinutes(ev.end) };
      }
      if (isOvernight(ev) && isoDate(addDays(parseDate(ev.date), 1)) === iso) {
        return { ...ev, _segStart: "00:00", _segEndMin: timeToMinutes(ev.end), _tail: true };
      }
      return null;
    }

    function rangesOverlap(a, b) {
      const as = timeToMinutes(a._segStart || a.start), ae = a._segEndMin != null ? a._segEndMin : timeToMinutes(a.end);
      const bs = timeToMinutes(b._segStart || b.start), be = b._segEndMin != null ? b._segEndMin : timeToMinutes(b.end);
      return as < be && bs < ae;
    }

    /* lay out overlapping events side by side.
       Tasks float on top; any plain event that shares time with a task
       becomes a translucent full-width background block instead of being
       squeezed into a narrow column next to it. */
    function layoutDayEvents(events) {
      const tasks = events.filter(e => e.isTask);
      const plain = events.filter(e => !e.isTask);

      plain.forEach(ev => { ev._bg = tasks.some(t => rangesOverlap(t, ev)); });
      const foreground = plain.filter(e => !e._bg);
      const background = plain.filter(e => e._bg);

      const sorted = [...foreground].sort((a, b) => timeToMinutes(a._segStart || a.start) - timeToMinutes(b._segStart || b.start));
      const cols = [];
      sorted.forEach(ev => {
        let placed = false;
        for (const col of cols) {
          const last = col[col.length - 1];
          if (timeToMinutes(ev.start) >= timeToMinutes(last.end)) { col.push(ev); ev._col = cols.indexOf(col); placed = true; break; }
        }
        if (!placed) { ev._col = cols.length; cols.push([ev]); }
      });
      const total = Math.max(1, cols.length);

      const bgHtml   = background.map(ev => eventMarkup(ev, 0, 1)).join("");
      const fgHtml   = sorted.map(ev => eventMarkup(ev, ev._col || 0, total)).join("");
      const taskHtml = tasks.map(ev => eventMarkup(ev, 0, 1)).join("");
      return bgHtml + fgHtml + taskHtml;
    }

    const CHECK_SVG = '<svg viewBox="0 0 12 12" fill="none"><path d="M2 6l2.5 2.5L10 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    function eventMarkup(ev, col = 0, total = 1) {
      const cal = getCalendar(ev.calendarId);
      const color = ev.color || cal.color;
      // geometry follows the slice shown on this day (overnight events are split)
      const segStartMin = timeToMinutes(ev._segStart || ev.start);
      const segEndMin = ev._segEndMin != null ? ev._segEndMin : timeToMinutes(ev.end);
      const top = (segStartMin - START_HOUR * 60) / 60 * HOUR_HEIGHT;
      const height = Math.max(22, (segEndMin - segStartMin) / 60 * HOUR_HEIGHT - 2);
      const compact = height < 40 ? "compact" : "";
      const gap = 3;
      const widthPct = 100 / total;
      const leftStyle = total > 1
        ? `left:calc(${col * widthPct}% + 3px);width:calc(${widthPct}% - ${gap + 3}px);right:auto;`
        : "";
      const overnight = isOvernight(ev);
      const classes = ["event", compact, ev.isTask ? "is-task" : "", ev._bg ? "bg-block" : "",
                       ev.done ? "done" : "", ev._tail ? "seg-tail" : "", (overnight && !ev._tail) ? "seg-head" : ""].filter(Boolean).join(" ");
      const draggable = isMobile() ? "false" : "true";
      const check = ev.isTask
        ? `<button class="event-check" data-toggle-done="${ev.id}" data-date="${ev.date}" title="Отметить выполнение">${CHECK_SVG}</button>`
        : "";
      const repeatBadge = (ev.repeat && ev.repeat !== "none") ? `<span class="event-repeat-badge">⟳</span>` : "";
      const locationLine = (ev.location && height > 56) ? `<div class="event-location">📍 ${escapeHtml(ev.location)}</div>` : "";
      return `
        <div class="${classes}" draggable="${draggable}" data-event-id="${ev.id}" data-date="${ev.date}"
             style="top:${top}px;height:${height}px;background:${color};${leftStyle}">
          <div class="event-head">
            ${check}
            <div style="min-width:0;flex:1">
              <div class="event-title">${escapeHtml(ev.title)}${repeatBadge}</div>
              ${height > 34 ? `<div class="event-time">${formatTime(ev.start)} — ${formatTime(ev.end)}${overnight ? " ⤍" : ""}</div>` : ""}
              ${height > 62 && ev.description ? `<div class="event-desc">${escapeHtml(ev.description)}</div>` : ""}
              ${locationLine}
            </div>
          </div>
          ${(ev._holiday || overnight || height < 38) ? "" : `<div class="event-resize" data-resize="${ev.id}" data-date="${ev.date}"></div>`}
        </div>
      `;
    }

    function addNowLine(days) {
      const todayIndex = days.findIndex(day => sameDay(day, new Date()));
      if (todayIndex === -1) return;
      const now = new Date();
      const minutes = now.getHours() * 60 + now.getMinutes();
      if (minutes < START_HOUR * 60 || minutes > END_HOUR * 60) return;
      const grid = els.calendarShell.querySelector(".grid");
      if (!grid) return;
      const line = document.createElement("div");
      line.className = "now-line";
      line.style.top = `${(minutes - START_HOUR * 60) / 60 * HOUR_HEIGHT}px`;
      grid.appendChild(line);
    }

    function bindDayTitles() {
      els.calendarShell.querySelectorAll(".day-title[data-date]").forEach(t => {
        t.addEventListener("click", () => {
          state.selectedDate = parseDate(t.dataset.date);
          state.miniDate = new Date(state.selectedDate);
          state.view = "day";
          saveView();
          syncViewButtons();
          renderAll();
        });
      });
    }

    function bindGridInteractions() {
      els.calendarShell.querySelectorAll(".hour-cell").forEach(cell => {
        /* on desktop, a simple click on a cell opens the modal;
           on mobile we skip this so taps don't block scrolling */
        cell.addEventListener("click", () => {
          if (isMobile()) return;
          const start = `${pad(Number(cell.dataset.hour))}:00`;
          openModal({ date: cell.dataset.date, start, end: addMinutesToTime(start, 60) });
        });
        cell.addEventListener("dragover", (e) => e.preventDefault());
        cell.addEventListener("drop", (e) => {
          e.preventDefault();
          const id = e.dataTransfer.getData("text/event-id");
          const ev = state.events.find(item => item.id === id);
          if (!ev) return;
          const duration = eventDurationMin(ev);
          const rect = cell.getBoundingClientRect();
          const offsetMin = Math.max(0, Math.min(59, Math.round((e.clientY - rect.top) / HOUR_HEIGHT * 60)));
          const startMin = Math.min(24 * 60 - 1, Number(cell.dataset.hour) * 60 + offsetMin);
          const start = minToHHMM(startMin);
          ev.date = cell.dataset.date;
          ev.start = start;
          ev.end = addMinutesToTime(start, duration);
          ev.allDay = false;
          saveEvents();
          renderAll();
          showToast("Событие перенесено");
        });
      });

      /* time range drag selection — shared helpers */
      let dragState = null;

      function getHourMinFromY(col, clientY) {
        const rect = col.getBoundingClientRect();
        const y = clientY - rect.top;
        const totalMinutes = Math.max(0, Math.floor(y / HOUR_HEIGHT * 60));
        const h = START_HOUR + Math.floor(totalMinutes / 60);
        const m = totalMinutes % 60;
        return { h: Math.min(h, 23), m: Math.min(m, 59) };
      }

      function snapToSlot(h, m) {
        if (m >= 60) return { h: Math.min(h + 1, 23), m: 0 };
        return { h, m };
      }

      function updateOverlay(ds) {
        const startMin = Math.min(ds.startH * 60 + ds.startM, ds.endH * 60 + ds.endM);
        const endMin   = Math.max(ds.startH * 60 + ds.startM, ds.endH * 60 + ds.endM);
        const topPx    = (startMin - START_HOUR * 60) / 60 * HOUR_HEIGHT;
        const heightPx = Math.max(HOUR_HEIGHT / 2, (endMin - startMin) / 60 * HOUR_HEIGHT);
        if (!ds.overlay) {
          ds.overlay = document.createElement("div");
          ds.overlay.className = "time-select-overlay";
          ds.col.appendChild(ds.overlay);
        }
        ds.overlay.style.top    = `${topPx}px`;
        ds.overlay.style.height = `${heightPx}px`;
      }

      function commitDrag(ds) {
        if (ds.overlay) ds.overlay.remove();
        if (ds.moved) {
          const startMin = Math.min(ds.startH * 60 + ds.startM, ds.endH * 60 + ds.endM);
          const endMin   = Math.max(ds.startH * 60 + ds.startM, ds.endH * 60 + ds.endM);
          const start = `${pad(Math.floor(startMin / 60))}:${pad(startMin % 60)}`;
          const end   = `${pad(Math.floor(endMin   / 60))}:${pad(endMin   % 60)}`;
          openModal({ date: ds.date, start, end });
        }
      }

      /* ── DESKTOP: mouse drag-to-create ── */
      els.calendarShell.querySelectorAll(".day-col").forEach(col => {
        col.addEventListener("mousedown", (e) => {
          if (isMobile()) return;
          if (els.modalBackdrop.classList.contains("open")) return;
          if (e.button !== 0) return;
          if (e.target.closest(".event, [data-resize]")) return;
          e.preventDefault();
          const { h, m } = getHourMinFromY(col, e.clientY);
          const snapped = snapToSlot(h, m);
          dragState = {
            col,
            date: col.dataset.date,
            startH: snapped.h,
            startM: snapped.m,
            endH: snapped.h,
            endM: snapped.m,
            moved: false,
            overlay: null,
            startY: e.clientY,
            type: "mouse"
          };
        });
      });

      document.addEventListener("mousemove", (e) => {
        if (!dragState || dragState.type !== "mouse") return;
        const dy = Math.abs(e.clientY - dragState.startY);
        if (dy < 8) return;
        dragState.moved = true;
        const { h, m } = getHourMinFromY(dragState.col, e.clientY);
        const snapped = snapToSlot(h, m);
        dragState.endH = snapped.h;
        dragState.endM = snapped.m;
        updateOverlay(dragState);
      });

      document.addEventListener("mouseup", (e) => {
        if (!dragState || dragState.type !== "mouse") return;
        const ds = dragState;
        dragState = null;
        commitDrag(ds);
      });

      /* ── MOBILE: long-press to create (a plain drag scrolls the page) ── */
      els.calendarShell.querySelectorAll(".day-col").forEach(col => {
        let pending = null;       // candidate before long-press confirms
        let longPressTimer = null;

        function clearPending() {
          if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
          pending = null;
        }

        col.addEventListener("touchstart", (e) => {
          if (e.target.closest(".event, .draft-event")) return;
          if (els.modalBackdrop.classList.contains("open")) return;
          const touch = e.changedTouches[0];
          const { h, m } = getHourMinFromY(col, touch.clientY);
          const snapped = snapToSlot(h, m);
          const startMin = snapped.h * 60 + snapped.m;
          const endMin = Math.min(startMin + 60, 24 * 60); // default 1-hour block
          pending = {
            col,
            date: col.dataset.date,
            startH: snapped.h,
            startM: snapped.m,
            endH: Math.floor(endMin / 60),
            endM: endMin % 60,
            moved: true,          // long-press always commits
            overlay: null,
            startX: touch.clientX,
            startY: touch.clientY,
            type: "touch",
            active: false
          };
          longPressTimer = setTimeout(() => {
            if (!pending) return;
            pending.active = true;
            dragState = pending;
            updateOverlay(dragState);
            if (navigator.vibrate) navigator.vibrate(15);
          }, 350);
        }, { passive: true });

        col.addEventListener("touchmove", (e) => {
          if (!pending) return;
          const touch = e.changedTouches[0];
          const dx = Math.abs(touch.clientX - pending.startX);
          const dy = Math.abs(touch.clientY - pending.startY);

          if (!pending.active) {
            /* moved before long-press fired → user is scrolling, abort */
            if (dx > 10 || dy > 10) clearPending();
            return; // passive: let the page scroll normally
          }

          /* in active drag-create mode: block scroll and resize the selection */
          e.preventDefault();
          const { h, m } = getHourMinFromY(col, touch.clientY);
          const snapped = snapToSlot(h, m);
          dragState.endH = snapped.h;
          dragState.endM = snapped.m;
          updateOverlay(dragState);
        }, { passive: false });

        col.addEventListener("touchend", (e) => {
          const wasActive = pending && pending.active;
          if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
          if (wasActive && dragState) {
            e.preventDefault();
            const ds = dragState;
            dragState = null;
            commitDrag(ds);
          } else if (pending) {
            /* pending survives only if the finger never moved far enough to
               scroll, so this is a deliberate tap: create a 1-hour event */
            e.preventDefault();
            const ds = pending;
            openModal({
              date: ds.date,
              start: `${pad(ds.startH)}:${pad(ds.startM)}`,
              end: `${pad(ds.endH)}:${pad(ds.endM)}`
            });
          }
          pending = null;
        }, { passive: false });

        col.addEventListener("touchcancel", () => {
          if (dragState && dragState.overlay) dragState.overlay.remove();
          dragState = null;
          clearPending();
        }, { passive: true });
      });
    }

    function openByElement(el) {
      const id = el.dataset.eventId;
      const date = el.dataset.date;
      if (id && id.startsWith("hol-")) {
        showToast(el.textContent.trim() + " — государственный праздник");
        return;
      }
      const base = state.events.find(x => x.id === id);
      if (base) openModal({ ...base, date: date || base.date });
    }

    function toggleDone(id, date) {
      const ev = state.events.find(x => x.id === id);
      if (!ev) return;
      pushHistory();
      if (ev.repeat && ev.repeat !== "none") {
        if (!Array.isArray(ev.doneDates)) ev.doneDates = [];
        const i = ev.doneDates.indexOf(date);
        if (i >= 0) ev.doneDates.splice(i, 1); else ev.doneDates.push(date);
      } else {
        ev.done = !ev.done;
      }
      saveEvents();
      renderAll();
    }

    let suppressClickUntil = 0;

    function bindEventInteractions() {
      els.calendarShell.querySelectorAll("[data-toggle-done]").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleDone(btn.dataset.toggleDone, btn.dataset.date);
        });
      });

      els.calendarShell.querySelectorAll("[data-resize]").forEach(bindResize);

      els.calendarShell.querySelectorAll(".event[data-event-id], .allday-chip[data-event-id]").forEach(el => {
        el.addEventListener("click", (e) => {
          if (e.target.closest("[data-toggle-done], [data-resize]")) return;
          if (Date.now() < suppressClickUntil) return;   // just finished a drag-move
          e.stopPropagation();
          openByElement(el);
        });
        el.addEventListener("dragstart", (e) => {
          e.dataTransfer.setData("text/event-id", el.dataset.eventId);
        });
        if (el.classList.contains("event")) bindEventMove(el);
      });
    }

    /* mobile: long-press an event, then drag to move it to another time/day */
    function bindEventMove(el) {
      el.addEventListener("pointerdown", (e) => {
        if (!isMobile() || e.pointerType === "mouse") return;
        if (e.target.closest("[data-resize], .event-check")) return;
        const col0 = el.closest(".day-col");
        const base = state.events.find(x => x.id === el.dataset.eventId);
        if (!col0 || !base || base._holiday) return;
        if (base.repeat && base.repeat !== "none") return; // don't move whole series by drag

        const durMin = timeToMinutes(base.end) - timeToMinutes(base.start);
        const grabOffset = e.clientY - el.getBoundingClientRect().top;
        const startX = e.clientX, startY = e.clientY;
        let moveMode = false, moved = false, newStart = timeToMinutes(base.start), newDate = base.date;

        const scroller = el.closest("#scrollArea");
        // preventDefault on pointermove does NOT stop touch scrolling — only a
        // non-passive touchmove does, so block it here once the drag is armed
        const blockScroll = (te) => { if (moveMode) te.preventDefault(); };
        document.addEventListener("touchmove", blockScroll, { passive: false });
        const timer = setTimeout(() => {
          moveMode = true;
          try { el.setPointerCapture(e.pointerId); } catch {}
          el.classList.add("dragging");
          // freeze the grid: without this the drag scrolls the whole calendar
          if (scroller) scroller.style.overflow = "hidden";
          if (navigator.vibrate) navigator.vibrate(15);
        }, 350);

        const onMove = (ev) => {
          if (!moveMode) {
            if (Math.abs(ev.clientX - startX) > 10 || Math.abs(ev.clientY - startY) > 10) cleanup();
            return;
          }
          ev.preventDefault();
          moved = true;
          const under = document.elementFromPoint(ev.clientX, ev.clientY);
          const targetCol = (under && under.closest && under.closest(".day-col")) || col0;
          const rect = targetCol.getBoundingClientRect();
          let mins = Math.round((ev.clientY - rect.top - grabOffset) / HOUR_HEIGHT * 60);
          mins = Math.max(START_HOUR * 60, Math.min(mins, END_HOUR * 60 - durMin));
          newStart = mins;
          newDate = targetCol.dataset.date;
          el.style.top = ((mins - START_HOUR * 60) / 60 * HOUR_HEIGHT) + "px";
        };
        const onUp = () => {
          clearTimeout(timer);
          cleanup();
          el.classList.remove("dragging");
          if (scroller) scroller.style.overflow = "";
          if (moveMode && moved) {
            suppressClickUntil = Date.now() + 400;
            pushHistory();
            base.date = newDate; base.endDate = newDate;
            base.start = minToHHMM(newStart);
            base.end = minToHHMM(Math.min(newStart + durMin, END_HOUR * 60 - 1));
            base.allDay = false;
            saveEvents(); scheduleNotifications(); renderAll();
            showToast("Событие перенесено");
          }
        };
        function cleanup() {
          document.removeEventListener("pointermove", onMove);
          document.removeEventListener("pointerup", onUp);
          document.removeEventListener("pointercancel", onUp);
          document.removeEventListener("touchmove", blockScroll);
        }
        document.addEventListener("pointermove", onMove, { passive: false });
        document.addEventListener("pointerup", onUp);
        document.addEventListener("pointercancel", onUp);
      });
    }

    /* drag the bottom edge of a timed event to change its end time */
    function bindResize(handle) {
      handle.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        e.stopPropagation();
        const eventEl = handle.closest(".event");
        const col = handle.closest(".day-col");
        if (!eventEl || !col) return;
        const ev = state.events.find(x => x.id === handle.dataset.resize);
        if (!ev) return;

        eventEl.draggable = false;
        handle.setPointerCapture(e.pointerId);
        const colRect = col.getBoundingClientRect();
        const startMin = timeToMinutes(ev.start);

        const move = (me) => {
          const y = me.clientY - colRect.top;
          let endMin = START_HOUR * 60 + Math.round(y / HOUR_HEIGHT * 60);
          endMin = Math.min(END_HOUR * 60, Math.max(startMin + 15, endMin));
          eventEl.style.height = `${Math.max(30, (endMin - startMin) / 60 * HOUR_HEIGHT - 4)}px`;
          eventEl.dataset.tmpEnd = `${pad(Math.floor(endMin / 60))}:${pad(endMin % 60)}`;
        };
        const up = () => {
          handle.removeEventListener("pointermove", move);
          handle.removeEventListener("pointerup", up);
          const newEnd = eventEl.dataset.tmpEnd;
          eventEl.draggable = true;
          if (newEnd && newEnd !== ev.end) {
            pushHistory();
            ev.end = newEnd;
            saveEvents();
            renderAll();
            showToast("Длительность изменена" + (ev.repeat !== "none" ? " (для всей серии)" : ""));
          } else {
            renderAll();
          }
        };
        handle.addEventListener("pointermove", move);
        handle.addEventListener("pointerup", up);
      });
    }

    /* ---------------- AGENDA VIEW ---------------- */
    function renderAgenda() {
      const startDate = new Date(state.selectedDate.getFullYear(), state.selectedDate.getMonth(), state.selectedDate.getDate());
      const startIso = isoDate(startDate);
      const horizon = isoDate(addDays(startDate, 60));

      const events = getOccurrences(startIso, horizon)
        .sort((a, b) => (a.date).localeCompare(b.date)
          || Number(b.allDay) - Number(a.allDay)
          || a.start.localeCompare(b.start));

      if (!events.length) {
        els.calendarShell.innerHTML = `<div class="empty-state">
          <div>
            <div style="font-size:34px;margin-bottom:8px">📭</div>
            <div style="font-weight:760;font-size:16px;color:var(--text)">Пусто на ближайшие 2 месяца</div>
            <div style="margin-top:6px">Нажмите «+», чтобы добавить событие</div>
          </div>
        </div>`;
        return;
      }

      const groups = {};
      events.forEach(ev => { (groups[ev.date] = groups[ev.date] || []).push(ev); });

      const html = Object.keys(groups).sort().map(dateStr => {
        const day = parseDate(dateStr);
        const isToday = sameDay(day, new Date());
        const items = groups[dateStr].map(ev => {
          const cal = getCalendar(ev.calendarId);
          const time = ev.allDay ? "Весь день" : `${formatTime(ev.start)} — ${formatTime(ev.end)}`;
          const repeatBadge = (ev.repeat && ev.repeat !== "none") ? " ⟳" : "";
          const check = ev.isTask
            ? `<button class="agenda-check" data-toggle-done="${ev.id}" data-date="${ev.date}" title="Выполнено">${CHECK_SVG}</button>`
            : "";
          return `
            <button class="agenda-item ${ev.done ? "done" : ""}" data-event-id="${ev.id}" data-date="${ev.date}">
              ${check}
              <span class="agenda-bar" style="background:${ev.color || cal.color}"></span>
              <span class="agenda-meta">
                <span class="agenda-time">${time}${repeatBadge}</span>
                <span class="agenda-title">${escapeHtml(ev.title)}</span>
                ${ev.location ? `<span class="agenda-note">📍 ${escapeHtml(ev.location)}</span>` : ""}
                ${ev.description ? `<span class="agenda-note">${escapeHtml(ev.description)}</span>` : ""}
                <span class="agenda-cal"><span class="calendar-dot" style="width:8px;height:8px;background:${cal.color}"></span>${cal.name}</span>
              </span>
            </button>`;
        }).join("");

        return `
          <div class="agenda-group">
            <div class="agenda-date ${isToday ? "is-today" : ""}">
              <div class="num">${day.getDate()}</div>
              <div class="dow">${isToday ? "Сегодня" : DOW[(day.getDay() + 6) % 7]}</div>
              <div class="month">${MONTHS_SHORT[day.getMonth()]}</div>
            </div>
            <div class="agenda-items">${items}</div>
          </div>`;
      }).join("");

      els.calendarShell.innerHTML = `<div class="agenda-view"><div class="agenda-wrap">${html}</div></div>`;

      els.calendarShell.querySelectorAll("[data-toggle-done]").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleDone(btn.dataset.toggleDone, btn.dataset.date);
        });
      });
      els.calendarShell.querySelectorAll(".agenda-item[data-event-id]").forEach(el => {
        el.addEventListener("click", (e) => {
          if (e.target.closest("[data-toggle-done]")) return;
          openByElement(el);
        });
      });
    }

    /* ---------------- MONTH VIEW ---------------- */
    function renderMonthView() {
      const year = state.selectedDate.getFullYear();
      const month = state.selectedDate.getMonth();
      const first = new Date(year, month, 1);
      const gridStart = startOfWeek(first);
      const days = Array.from({ length: 42 }, (_, i) => addDays(gridStart, i));
      const occ = getOccurrences(isoDate(gridStart), isoDate(days[41]));

      els.calendarShell.innerHTML = `
        <div class="month-view">
          <div class="month-grid">
            ${orderedDow().map(d => `<div class="month-dow">${d}</div>`).join("")}
            ${days.map(day => {
              const dateStr = isoDate(day);
              const events = occ.filter(ev => ev.date === dateStr)
                .sort((a,b)=> Number(b.allDay)-Number(a.allDay) || a.start.localeCompare(b.start));
              const shown = events.slice(0, 4);
              const hidden = events.length - shown.length;
              const classes = [
                "month-cell",
                day.getMonth() !== month ? "outside" : "",
                sameDay(day, new Date()) ? "today" : ""
              ].filter(Boolean).join(" ");

              const dots = events.slice(0, 4).map(ev => {
                const cal = getCalendar(ev.calendarId);
                return `<span class="month-dot" style="background:${cal.color}"></span>`;
              }).join("");

              return `
                <div class="${classes}" data-date="${dateStr}">
                  <button class="month-date" data-create-date="${dateStr}">${day.getDate()}</button>
                  <div class="month-dot-row">${dots}</div>
                  ${shown.map(ev => {
                    const cal = getCalendar(ev.calendarId);
                    const color = ev.color || cal.color;
                    const label = ev.allDay ? escapeHtml(ev.title) : `${formatTime(ev.start)} ${escapeHtml(ev.title)}`;
                    return `<button class="month-event" data-event-id="${ev.id}" data-date="${ev.date}" style="background:${color}">${label}</button>`;
                  }).join("")}
                  ${hidden > 0 ? `<button class="more-label" data-peek-date="${dateStr}" style="color:var(--muted);font-size:12px;font-weight:700;text-align:left;">+ ещё ${hidden}</button>` : ""}
                </div>
              `;
            }).join("")}
          </div>
        </div>
      `;

      els.calendarShell.querySelectorAll("[data-create-date]").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          // on mobile, tapping a day number opens that day
          if (isMobile()) {
            state.selectedDate = parseDate(btn.dataset.createDate);
            state.miniDate = new Date(state.selectedDate);
            state.view = "day";
            saveView();
            syncViewButtons();
            renderAll();
          } else {
            openModal({ date: btn.dataset.createDate, start: "10:00", end: "11:00" });
          }
        });
      });

      els.calendarShell.querySelectorAll(".month-event[data-event-id]").forEach(el => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          openByElement(el);
        });
      });

      els.calendarShell.querySelectorAll("[data-peek-date]").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          openDayPeek(btn.dataset.peekDate);
        });
      });

      els.calendarShell.querySelectorAll(".month-cell").forEach(cell => {
        cell.addEventListener("dblclick", () => {
          openModal({ date: cell.dataset.date, start: "10:00", end: "11:00" });
        });
      });
    }

    /* popover listing all events of a single day (month "+N more") */
    function openDayPeek(iso) {
      const day = parseDate(iso);
      const events = getOccurrences(iso, iso)
        .filter(ev => ev.date === iso || spansDay(ev, iso))
        .sort((a, b) => Number(b.allDay) - Number(a.allDay) || a.start.localeCompare(b.start));
      const rows = events.map(ev => {
        const cal = getCalendar(ev.calendarId);
        const time = ev.allDay ? "Весь день" : `${formatTime(ev.start)}–${formatTime(ev.end)}`;
        return `<button class="slot-item" data-peek-event="${ev.id}" data-peek-evdate="${ev.date}" style="width:100%;text-align:left;cursor:pointer">
          <span><span class="calendar-dot" style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${ev.color || cal.color};margin-right:8px"></span>${escapeHtml(ev.title)}</span>
          <span style="color:var(--muted);font-size:13px">${time}</span>
        </button>`;
      }).join("") || `<p style="color:var(--muted)">Нет событий.</p>`;
      openToolModal(`${day.getDate()} ${MONTHS_TITLE[day.getMonth()]}`, rows);
      els.toolModalBody.querySelectorAll("[data-peek-event]").forEach(btn => {
        btn.addEventListener("click", () => {
          const ev = state.events.find(x => x.id === btn.dataset.peekEvent);
          closeToolModal();
          if (ev) openModal({ ...ev, date: btn.dataset.peekEvdate });
        });
      });
    }

    function renderUpcoming() {
      const nowDate = isoDate(new Date());
      const horizon = isoDate(addDays(new Date(), state.upDays));
      const show = state.upShow || [];
      const events = getOccurrences(nowDate, horizon)
        .filter(ev => {
          if (ev._holiday || ev.calendarId === "holidays") return show.includes("holidays");
          if (ev.calendarId === "birthdays") return show.includes("birthdays");
          if (ev.isTask) return show.includes("tasks");
          return show.includes("events");
        })
        .sort((a, b) => (a.date + (a.allDay ? "00:00" : a.start)).localeCompare(b.date + (b.allDay ? "00:00" : b.start)))

    /* ---------------- MODAL ---------------- */
    const PRESET_REMINDERS = [0, 10, 30, 60, 1440];

    function reminderLabel(min) {
      if (min === 0) return "В момент";
      if (min % 1440 === 0) return `За ${min / 1440} дн.`;
      if (min % 60 === 0) return `За ${min / 60} ч`;
      return `За ${min} мин`;
    }

    function setReminderChips(reminders) {
      els.remindersGroup.querySelectorAll(".reminder-chip.custom").forEach(c => c.remove());
      els.remindersGroup.querySelectorAll(".reminder-chip").forEach(chip => {
        const input = chip.querySelector("input");
        const on = reminders.includes(Number(input.value));
        input.checked = on;
        chip.classList.toggle("on", on);
      });
      // anything that is not a preset becomes its own removable chip
      reminders.filter(m => !PRESET_REMINDERS.includes(m)).forEach(addCustomReminderChip);
    }

    function addCustomReminderChip(minutes) {
      if (getReminderChips().includes(minutes)) return;
      const chip = document.createElement("label");
      chip.className = "reminder-chip custom on";
      chip.innerHTML = `<input type="checkbox" value="${minutes}" checked /><span>${reminderLabel(minutes)}</span>`;
      els.remindersGroup.appendChild(chip);

    /* ---------------- TASKS ---------------- */
    /* A plain list of everything flagged as a task in the calendar,
       grouped by when it is due. Same data, different view. */
    function openTasks() {
      closeDrawer();
      const todayIso = isoDate(new Date());
      const from = isoDate(addDays(new Date(), -365));
      const to = isoDate(addDays(new Date(), 365));

      const tasks = getOccurrences(from, to)
        .filter(ev => ev.isTask && !ev._holiday)
        .sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));

      const isDone = (ev) => (ev.repeat && ev.repeat !== "none")
        ? (ev.doneDates || []).includes(ev.date)
        : !!ev.done;

      const buckets = [
        { key: "over",  title: "Просрочено", items: [] },
        { key: "today", title: "Сегодня",    items: [] },
        { key: "soon",  title: "Дальше",     items: [] },
        { key: "done",  title: "Выполнено",  items: [] }
      ];
      tasks.forEach(ev => {
        if (isDone(ev)) buckets[3].items.push(ev);
        else if (ev.date < todayIso) buckets[0].items.push(ev);
        else if (ev.date === todayIso) buckets[1].items.push(ev);
        else buckets[2].items.push(ev);
      });

      const rowFor = (ev) => {
        const day = parseDate(ev.date);
        const when = ev.date === todayIso
          ? (ev.allDay ? "сегодня" : formatTime(ev.start))
          : `${day.getDate()} ${MONTHS_SHORT[day.getMonth()]}${ev.allDay ? "" : ", " + formatTime(ev.start)}`;
        const done = isDone(ev);
        return `<div class="task-row${done ? " done" : ""}">
          <button type="button" class="task-check" data-done-id="${ev.id}" data-done-date="${ev.date}" aria-label="Выполнено">${CHECK_SVG}</button>
          <button type="button" class="task-main" data-open-id="${ev.id}" data-open-date="${ev.date}">
            <span class="task-title">${escapeHtml(ev.title)}</span>
            <span class="task-when">${when}</span>
          </button>
        </div>`;
      };

      const body = buckets.filter(b => b.items.length).map(b =>
        `<h3 class="set-group">${b.title} · ${b.items.length}</h3>${b.items.map(rowFor).join("")}`
      ).join("") || `<p style="color:var(--muted)">Задач пока нет. Отметьте «Задача» при создании события.</p>`;

          renderAll();
          openModal({ ...ev, date: btn.dataset.openDate });

    /* ---------------- FIND FREE TIME ---------------- */
    function busyIntervalsForDay(iso) {
      // returns sorted [ [startMin,endMin], ... ] of non-all-day, non-task events
      const occ = getOccurrences(iso, iso)
        .filter(ev => !ev.allDay && !ev._holiday && ev.date === iso);
      return occ.map(ev => [timeToMinutes(ev.start), timeToMinutes(ev.end)])
        .sort((a, b) => a[0] - b[0]);
    }
    function findFreeSlots({ durationMin, days, dayStart, dayEnd }) {
      const results = [];
      let cursor = new Date();
      cursor = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate());
      for (let d = 0; d < days && results.length < 30; d++) {
        const day = addDays(cursor, d);
        const iso = isoDate(day);
        const busy = busyIntervalsForDay(iso);
        // earliest free time today is "now" rounded up
        let from = dayStart * 60;
        if (d === 0) {
          const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
          from = Math.max(from, Math.ceil(nowMin / 15) * 15);
        }
        const limit = dayEnd * 60;
        for (const [bs, be] of busy) {
          if (be <= from) continue;
          if (bs - from >= durationMin) {
            results.push({ iso, start: from, end: from + durationMin });
          }
          from = Math.max(from, be);
          if (from >= limit) break;
        }
        if (limit - from >= durationMin) {
          results.push({ iso, start: from, end: from + durationMin });
        }
      }
      return results.slice(0, 20);
    }
    function openFindTime() {
      closeDrawer();
      const html = `
        <div class="tool-grid">
          <div class="tool-field">
            <label>Длительность</label>

              <option value="30">30 дней</option>
            </select>
